[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atelier"
version = "0.1.0"
description = "Filesystem-first reproducibility tooling for AI-assisted software engineering."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.50.0",
  "click>=8.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "openai>=1.0.0",
  "pydantic>=2",
  "python-dotenv>=1.0.0",
  "python-frontmatter>=1.1.0",
  "python-ulid>=2.7.0",
  "pyyaml>=6.0.0",
  "sse-starlette>=2.0.0",
]

[project.scripts]
atelier = "atelier.cli.main:main"

[dependency-groups]
dev = [
  "pyright>=1.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["atelier", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["atelier", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
