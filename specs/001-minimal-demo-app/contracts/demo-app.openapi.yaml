openapi: 3.1.0
info:
  title: Minimal Demo App API
  version: 0.1.0
paths:
  /login:
    post:
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "303":
          description: Login succeeded and the browser is redirected to the notes page.
        "401":
          description: Credentials were rejected.
  /logout:
    post:
      summary: End the current session
      responses:
        "303":
          description: The session is cleared and the browser is redirected to the login page.
  /api/notes:
    get:
      summary: List notes for the signed-in user
      responses:
        "200":
          description: Current note list returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Authentication required.
    post:
      summary: Create a note for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: Note created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Authentication required.
        "422":
          description: Submitted note body failed validation.
  /api/notes/{note_id}:
    delete:
      summary: Delete a note for the signed-in user
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Note deleted.
        "401":
          description: Authentication required.
        "404":
          description: Note not found.
components:
  schemas:
    Note:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
        text:
          type: string
    NoteCreate:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
