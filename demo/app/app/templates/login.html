<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Login</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #f3ecd8 0%, #efe2b5 35%, #f8f5ee 100%);
        color: #1f1f1f;
      }

      main {
        width: min(26rem, calc(100vw - 2rem));
        padding: 2rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 18px 60px rgba(76, 52, 15, 0.18);
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 0.9rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 600;
      }

      input {
        padding: 0.75rem 0.85rem;
        border: 1px solid #bda572;
        border-radius: 0.75rem;
        font: inherit;
      }

      button {
        padding: 0.8rem 1rem;
        border: 0;
        border-radius: 999px;
        background: #1f4f46;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .error {
        padding: 0.75rem 0.9rem;
        border-radius: 0.75rem;
        background: #ffe0dc;
        color: #8a2216;
      }

      .hint {
        margin-top: 1rem;
        font-size: 0.95rem;
        color: #54452a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Atelier Demo Login</h1>
      <p>Use the configured demo account to enter the protected notes flow.</p>
      {% if error %}
      <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <form action="/login" method="post">
        <label>
          Email
          <input type="email" name="email" value="{{ demo_user }}" required />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <button type="submit">Sign In</button>
      </form>
      <p class="hint">Default account email: <strong>{{ demo_user }}</strong></p>
    </main>
  </body>
</html>
