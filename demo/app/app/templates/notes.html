<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Notes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(204, 236, 212, 0.85), rgba(247, 247, 242, 0.95)),
          linear-gradient(45deg, rgba(20, 88, 71, 0.15), transparent 55%);
        color: #14241f;
      }

      .shell {
        width: min(54rem, calc(100vw - 2rem));
        margin: 2rem auto;
        padding: 1.5rem;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtle {
        color: #355449;
      }

      .panel {
        padding: 1.2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 14px 40px rgba(20, 36, 31, 0.1);
      }

      form {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      input {
        flex: 1 1 14rem;
        padding: 0.85rem 1rem;
        border: 1px solid #8bb19e;
        border-radius: 999px;
        font: inherit;
      }

      button {
        padding: 0.85rem 1rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
        background: #145847;
        color: #fff;
      }

      button.secondary {
        background: #2d3b36;
      }

      ul {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        display: grid;
        gap: 0.8rem;
      }

      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        padding: 0.95rem 1rem;
        border-radius: 0.9rem;
        background: rgba(255, 255, 255, 0.92);
      }

      .empty {
        color: #4f655d;
        font-style: italic;
      }

      #message {
        min-height: 1.5rem;
        margin: 0.8rem 0 0;
        color: #145847;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <p class="subtle">Signed in as {{ user }}</p>
          <h1>Demo Notes</h1>
        </div>
        <form action="/logout" method="post">
          <button class="secondary" type="submit">Log Out</button>
        </form>
      </header>

      <section class="panel">
        <form id="note-form">
          <input
            id="note-input"
            name="text"
            maxlength="280"
            placeholder="Write a short demo note"
            required
          />
          <button type="submit">Add Note</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <ul id="notes-list"></ul>
      </section>
    </div>

    <script>
      const listEl = document.getElementById("notes-list");
      const formEl = document.getElementById("note-form");
      const inputEl = document.getElementById("note-input");
      const messageEl = document.getElementById("message");

      function renderNotes(notes) {
        listEl.innerHTML = "";
        if (!notes.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No notes yet. Add one for the demo.";
          listEl.appendChild(empty);
          return;
        }

        notes.forEach((note) => {
          const item = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = note.text;

          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.dataset.noteId = note.id;
          button.textContent = "Delete";

          item.append(text, button);
          listEl.appendChild(item);
        });
      }

      async function loadNotes() {
        const response = await fetch("/api/notes");
        if (response.status === 401) {
          window.location.href = "/login";
          return;
        }
        const notes = await response.json();
        renderNotes(notes);
      }

      formEl.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageEl.textContent = "";

        const response = await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: inputEl.value }),
        });

        if (!response.ok) {
          messageEl.textContent = "Unable to save that note.";
          return;
        }

        inputEl.value = "";
        messageEl.textContent = "Note saved.";
        await loadNotes();
      });

      listEl.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-note-id]");
        if (!button) {
          return;
        }

        const response = await fetch(`/api/notes/${button.dataset.noteId}`, {
          method: "DELETE",
        });

        if (!response.ok) {
          messageEl.textContent = "Unable to delete that note.";
          return;
        }

        messageEl.textContent = "Note deleted.";
        await loadNotes();
      });

      loadNotes();
    </script>
  </body>
</html>
