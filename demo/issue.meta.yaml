id: w23-demo-login-rate-limit
lane: W23
title: "Demo App: Rate limit failed POST /login attempts"
status: drafted
created_at: 2026-04-20
owner: coder
body_path: demo/issue.md
source_tracking_issue:
  repo: ooiyeefei/agentic-coding-workflow-os
  number: 23
  title: "W23: Curated demo issue"
filing:
  mode: local-emulation
  status: emulated
  target_repo: null
  target_issue_number: null
  target_issue_url: null
  rationale: "The demo app lives inside this monorepo and does not have a separate GitHub issue tracker yet."
scope:
  app_path: demo/app
  auth_route: POST /login
  credentials_source: demo/app/.env.example
  rate_limit_rule: "5 failed attempts per client IP in a rolling 60-second window"
clarifications:
  storage: in-memory, process-local
  counted_attempts: failed attempts only
  successful_login_resets_counter: true
  blocked_ip_blocks_correct_credentials: true
  window_semantics: rolling 60-second window, not a fixed-duration lockout
  unblock_condition: the oldest counted failed attempt falls outside the last 60 seconds
  retry_after_rounding: ceil remaining seconds until unblock, minimum 1 while blocked
  client_identity: remote IP observed by the app in local development
  proxy_headers_trusted: false
limitations:
  - restart clears rate-limit state because storage is process-local
  - multiple app instances do not share counters
review_attack_surface:
  - off-by-one between attempts 5 and 6
  - Retry-After boundary and clock-skew math
  - IPv4 vs IPv6 localhost bucketing
  - multi-instance inconsistency because storage is process-local
acceptance_checks:
  - "If 5 failed attempts already exist in the prior rolling 60 seconds for one IP, the next POST /login returns 429 with Retry-After"
  - "Blocked IP continues receiving 429 until fewer than 5 failed attempts remain in the prior rolling 60 seconds"
  - "Retry-After is rounded up to an integer and is never 0 while blocked"
  - "Correct credentials work again once the rolling window no longer blocks the IP and preserve the existing redirect + session-cookie flow"
  - "Local UAT can reproduce the limit within 6 failed submissions"
next_consumer: W24
