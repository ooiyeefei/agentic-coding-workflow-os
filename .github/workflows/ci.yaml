name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: >-
          uv run pyright
          atelier/compiler
          atelier/council
          atelier/defaults
          atelier/evidence
          atelier/git
          atelier/memory
          atelier/personas
          atelier/skills
          atelier/workflow
          tests/integration
          scripts/run_e2e.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests --ignore=tests/integration -q

  integration-tests:
    runs-on: ubuntu-latest
    env:
      ATELIER_INTEGRATION_REAL_LLM: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: bash -n scripts/run-e2e.sh
      - run: rm -rf .atelier
      - run: ./scripts/run-e2e.sh
